<!DOCTYPE html>
<html lang="en">
 <head>
    <meta charset="UTF-8">
    <title>favour wedsite</title>
  </head>
  <body>
     <p>hello, {{ username }}!</p>
      {% if username %}
       <form method="POST" action ="/new-post">
        <input type="text" name="title" placeholder="post title">
        <input type="text"name ="body" placeholder="post body">
        <button type="submit">add post</button>
        <a href ="/logout" >logout</a>
       </form>
      {% else %}
       <p>please log in to post</p>
      {% endif %}
      {% for post in posts %}
        <h2>{{post[1]}}</h2>
      {% if post[3] == session.get("user_username")%}
        <p>by you </p>
      {%else%} 
        <P>by {{post[3]}}</P>
      {% endif %} 
       <p>{{post[2]}}</p>
       <hr>
      {% endfor %}
  </body>
</html>
